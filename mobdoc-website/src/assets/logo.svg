<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <!-- Rich Charcoal Dark Background -->
  <rect width="800" height="400" fill="#0D1117" rx="20"/>

  <!-- Minimalist Geometric Icon Mark -->
  <g transform="translate(100, 85)">
    <!-- Outer Shield / Container -->
    <rect x="0" y="0" width="130" height="230" rx="24" fill="none" stroke="#10B981" stroke-width="4"/>
    
    <!-- Phone Screen Area -->
    <rect x="12" y="24" width="106" height="150" rx="8" fill="#161B22"/>
    
    <!-- Integrated Repair Wrench / Cross Hybrid inside screen -->
    <path d="M 52,60 L 78,60 L 78,92 L 95,108 L 75,128 L 59,112 L 59,92 L 52,92 Z" fill="#10B981"/>
    
    <!-- Graduation Cap / Academy Element floating at top border -->
    <polygon points="65, -12 115, 10 65, 32 15, 10" fill="#FFFFFF"/>
    <path d="M 102,17 L 102,32 C 102,40 85,44 65,44 C 45,44 28,40 28,32 L 28,17" stroke="#FFFFFF" stroke-width="3" fill="none"/>
  </g>

  <!-- Premium Typography Section -->
  <!-- "MOB" in Clean White, "DOC" in Vibrant Emerald Green -->
  <text x="280" y="200" font-family="'Inter', 'SF Pro Display', 'Segoe UI', sans-serif" font-size="86" font-weight="800" fill="#FFFFFF" letter-spacing="3">
    MOB<tspan fill="#10B981">DOC</tspan>
  </text>

  <!-- Professional Tagline (Clean, uncluttered) -->
  <text x="285" y="250" font-family="'Inter', 'SF Pro Display', 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#8B949E" letter-spacing="5">
    MOBILE REPAIR &amp; TRAINING ACADEMY
  </text>
</svg>
